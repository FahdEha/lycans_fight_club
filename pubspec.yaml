name: lycans_fight_club
description: Lycans Fight Club App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  firebase_core: 4.14.0
  firebase_auth: 6.6.0
  firebase_database: 12.5.0
  provider: ^6.1.5+1
  google_fonts: ^8.2.1
  qr_flutter: ^4.1.0
#  intl: ^0.20.3
  shared_preferences: ^2.5.5
  flutter_svg: ^2.3.0
  url_launcher: ^6.2.2
  flutter_localizations:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: "^0.14.4"

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/icon/lycans_logo.jpeg"
  min_sdk_android: 21 # android min sdk min:16, default 21


flutter:
  uses-material-design: true

  fonts:
    - family: Pi Sheng
      fonts:
        - asset: assets/fonts/Pi Sheng.otf

  assets:
    - assets/images/